name: Captura de ocupación

on:
  schedule:
    # Cada 30 minutos entre las 4:00 y las 22:59 UTC (6:00 a 0:59 en Madrid en horario de verano)
    - cron: "5,35 4-22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: captura
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Capturar
        run: python capture.py

      - name: Guardar datos en el repositorio
        run: |
          git config user.name "captura-bot"
          git config user.email "captura-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Captura $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
