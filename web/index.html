<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Competencia BeatCore</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg: #f6f7f5; --surface: #ffffff; --fg: #1d2724; --muted: #5d6b66; --line: #dde3e0;
  --accent: #0f6b5c; --accent-rgb: 15 107 92; --comp: #c2570c; --comp-rgb: 194 87 12;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #121816; --surface: #19211e; --fg: #e5ece9; --muted: #9aaba5; --line: #2b3632;
    --accent: #5fc4b0; --accent-rgb: 95 196 176; --comp: #f09a55; --comp-rgb: 240 154 85; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #121816; --surface: #19211e; --fg: #e5ece9; --muted: #9aaba5; --line: #2b3632;
  --accent: #5fc4b0; --accent-rgb: 95 196 176; --comp: #f09a55; --comp-rgb: 240 154 85; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; }
main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 56px; display: grid; gap: 18px; }
main > *, .panel > * { min-width: 0; }
.eyebrow { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
h1 { margin: 2px 0 4px; font-family: var(--display); font-weight: 800; font-size: clamp(24px, 4vw, 34px); line-height: 1.1; }
h2 { margin: 0 0 10px; font-family: var(--display); font-weight: 700; font-size: 19px; }
h3 { margin: 0 0 6px; font-family: var(--display); font-weight: 600; font-size: 14px; color: var(--muted); }
.meta, .nota { margin: 0; color: var(--muted); font-size: 13px; max-width: none; }
.nota { margin-top: 8px; }
.aviso { background: rgb(var(--comp-rgb) / .12); border: 1px solid rgb(var(--comp-rgb) / .5); border-radius: 6px; padding: 8px 12px; font-size: 13px; }
details.filtros { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
details.filtros summary { cursor: pointer; font-weight: 600; font-family: var(--display); }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 14px; margin-top: 12px; align-items: end; }
.fgrid label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
select, input[type=date], button { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-height: 36px; }
.rango { display: flex; gap: 6px; align-items: center; }
.rango > * { flex: 1 1 0; min-width: 0; width: 100%; }
.rango input[type=date] { padding: 6px 4px; font-size: 14px; }
.fgrid label:has(.rango) { grid-column: span 2; min-width: 0; }
.fgrid label:has(.dias) { grid-column: span 3; min-width: 0; }
.fgrid label { min-width: 0; }
.fgrid select { width: 100%; min-width: 0; max-width: 100%; text-overflow: ellipsis; }
.dias { display: flex; flex-wrap: nowrap; gap: 4px; }
.dias label { padding: 5px 7px; font-size: 13px; }
@media (max-width: 700px) { .dias { flex-wrap: wrap; } .fgrid label:has(.rango), .fgrid label:has(.dias) { grid-column: auto; } }
.dias label { flex-direction: row; display: flex; align-items: center; gap: 4px; text-transform: none; letter-spacing: 0; font-size: 13px;
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-height: 36px; background: var(--bg); color: var(--fg); }
.sw { display: flex !important; flex-direction: row !important; align-items: center; gap: 8px; text-transform: none !important; letter-spacing: 0 !important;
  font-size: 14px !important; color: var(--fg) !important; min-height: 36px; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
nav.tabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 8px 12px; white-space: nowrap; font-weight: 600; color: var(--muted); cursor: pointer; }
nav.tabs button[aria-selected=true] { color: var(--accent); border-bottom-color: var(--accent); }
.panel[hidden] { display: none; }
.zonas { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.zonas > span { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin-right: 4px; }
.zonas button { border-radius: 999px; padding: 6px 14px; cursor: pointer; color: var(--muted); }
.zonas button[aria-pressed=true] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: grid; gap: 10px; min-width: 0; align-content: start; }
.card h2, .card h3 { margin: 0; }
.card .meta { font-size: 13px; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 4px 12px; margin-top: 10px; max-height: 260px; overflow: auto; }
.chip { font-size: 13px !important; min-height: 28px !important; }
.chip small { color: var(--muted); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
.guia { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 18px; margin-top: 12px; width: 100%; }
.guia h3 { margin: 0 0 8px; color: var(--fg); font-size: 15px; }
.guia ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; }
.guia ul ul { margin-top: 6px; gap: 3px; }
.guia li { color: var(--fg); }
[data-t="t-rit"] th { white-space: normal; vertical-align: bottom; line-height: 1.25; padding: 6px 8px; }
[data-t="t-rit"] td { padding: 6px 8px; }
[data-t="t-rit"] { overflow-x: auto; }
button.vc { padding: 2px 10px; min-height: 28px; cursor: pointer; font-size: 13px; }
ul.detalle { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14px; }
th.sub { background: var(--bg); color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.hm { max-width: 520px; overflow: visible; max-height: none; }
table.heat.peq { width: auto; table-layout: fixed; }
table.heat.peq th { width: 46px; font-size: 11px; padding: 3px 4px; }
table.heat.peq th:first-child { width: 40px; text-align: left; }
table.heat.peq td { width: 46px; height: 36px; padding: 2px 3px; font-size: 12px; line-height: 1.15; font-weight: 600; text-align: center; }
table.heat.peq td small { font-weight: 400; font-size: 10px; opacity: .85; }
table.heat.peq td.vacio { background: transparent; }
tr.subfila > td { background: var(--bg); padding: 10px 12px; white-space: normal; }
.subpanel { display: grid; gap: 10px; min-width: 0; }
button.exp { min-width: 44px; }
.cab-det { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
button.cerrar { cursor: pointer; font-weight: 600; white-space: nowrap; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.duo b { display: block; font-family: var(--display); font-size: 28px; line-height: 1.1; }
.duo small, .kpi small { color: var(--muted); font-size: 12px; display: block; }
.hb { display: grid; grid-template-columns: minmax(110px, 40%) 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
.hv { display: block; } .hv .bar { height: 10px; margin: 0; display: block; }
.hn { color: var(--muted); font-variant-numeric: tabular-nums; }
.panel { display: grid; gap: 22px; min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.kpi b { display: block; font-family: var(--display); font-size: 26px; line-height: 1.1; }
.kpi span { font-size: 12px; color: var(--muted); }
.kpi.a b { color: var(--accent); } .kpi.b b { color: var(--comp); }
.scroll { overflow: auto; max-height: 70vh; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 14px; }
th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
thead th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; background: var(--surface); position: sticky; top: 0; z-index: 1; }
th.sort { cursor: pointer; user-select: none; }
td.n, th.n { text-align: right; }
td.c, th.c { text-align: center; }
tbody tr.click { cursor: pointer; } tbody tr.click:hover { background: rgb(var(--accent-rgb) / .08); }
tr.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 99px; background: rgb(var(--accent-rgb) / .15); color: var(--accent); }
.tag.b { background: rgb(var(--comp-rgb) / .15); color: var(--comp); }
.heats { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px; }
.heats > div { min-width: 0; }
table.heat td, table.heat th { text-align: center; padding: 5px 4px; font-size: 12px; }
table.heat td { background: rgb(var(--c) / calc(var(--o) * .85)); }
table.heat td.dark { color: #fff; }
table.heat td.vacio { background: transparent; }
.bar { display: inline-block; height: 8px; border-radius: 4px; background: var(--comp); vertical-align: middle; margin-right: 6px; }
.bar.a { background: var(--accent); }
.chartbox { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px; position: relative; height: 340px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
iframe.mapa { width: 100%; height: 70vh; min-height: 420px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
a { color: var(--accent); }
.vacio-msg { color: var(--muted); padding: 16px; }
@media (max-width: 600px) { th, td { padding: 6px 7px; } }
</style>
</head>
<body>
<main>
<header>
  <p class="eyebrow">The Boutique Tribe · análisis de competencia</p>
  <h1>Competencia BeatCore</h1>
  <p class="meta" id="meta">Cargando datos…</p>
</header>
<div id="aviso" class="aviso" hidden></div>

<details class="filtros" open id="filtros">
  <summary>Filtros</summary>
  <div class="fgrid">
    <label>Centro BeatCore<select id="f-centro"></select></label>
    <label>Marca / cadena<select id="f-marca"></select></label>
    <label>Estudio<select id="f-estudio"></select></label>
    <label>Disciplina<select id="f-disc"></select></label>
    <label>Horas<span class="rango"><select id="f-h0"></select><select id="f-h1"></select></span></label>
    <label>Fechas<span class="rango"><input type="date" id="f-f0"><input type="date" id="f-f1"></span></label>
    <label>Día de la semana<span class="dias" id="f-dias"></span></label>
    <label class="sw"><input type="checkbox" id="f-fest" checked> Incluir festivos</label>
    <label class="sw"><input type="checkbox" id="f-vs" checked> BeatCore siempre visible (ignora marca, estudio y disciplina para dar perspectiva)</label>
    <button type="button" id="f-reset">Quitar filtros</button>
  </div>
</details>

<div class="zonas" id="zona-seg" aria-label="Centro BeatCore"><span>Centro</span></div>
<nav class="tabs" role="tablist" id="tabs"></nav>

<section class="panel" id="p-resumen" role="tabpanel"></section>
<section class="panel" id="p-ocupacion" role="tabpanel" hidden></section>
<section class="panel" id="p-facturacion" role="tabpanel" hidden></section>
<section class="panel" id="p-oferta" role="tabpanel" hidden></section>
<section class="panel" id="p-curvas" role="tabpanel" hidden></section>
<section class="panel" id="p-clases" role="tabpanel" hidden></section>
<section class="panel" id="p-proximas" role="tabpanel" hidden></section>
<section class="panel" id="p-precios" role="tabpanel" hidden></section>
<section class="panel" id="p-estudios" role="tabpanel" hidden></section>
<section class="panel" id="p-cadenas" role="tabpanel" hidden></section>
<section class="panel" id="p-alertas" role="tabpanel" hidden></section>
<section class="panel" id="p-mapa" role="tabpanel" hidden></section>
</main>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = v => v == null || isNaN(v) ? "–" : Math.round(v * 100) + "%";
const num = (v, d = 1) => v == null || isNaN(v) ? "–" : v.toFixed(d).replace(".", ",");
const eur = v => v == null ? "–" : v.toFixed(v % 1 ? 2 : 0).replace(".", ",") + " €";
const eur0 = v => v == null || isNaN(v) ? "–" : new Intl.NumberFormat("es-ES", { useGrouping: "always", maximumFractionDigits: 0 }).format(v) + " €";
const numC = v => v == null || isNaN(v) ? "–" : (Math.abs(v - Math.round(v)) < 0.05 ? String(Math.round(v)) : num(v));
const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const DIAS = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
const DISCS = ["Reformer", "Lagree", "Barre", "Yoga", "HIIT/Funcional", "Ciclo", "Boxeo", "Otros"];
const DISC_CAT = { "Pilates reformer": "Reformer", "Reformer": "Reformer", "Lagree": "Lagree", "Barre": "Barre", "Yoga": "Yoga", "Hot yoga": "Yoga",
  "Funcional": "HIIT/Funcional", "HIIT": "HIIT/Funcional", "Crossfit": "HIIT/Funcional", "Indoor cycling": "Ciclo", "Boxeo": "Boxeo" };
const ZN = { "Valencia": "Valencia (Ruzafa)", "Nacional": "Fuera de zonas BeatCore" };
const GRUPOS = ["Reformer y Lagree", "Barre y Pilates", "Yoga y Hot yoga", "Funcional y HIIT", "Crossfit y Boxeo", "Multidisciplina y otros", "Entrenamiento personal"];
const zn = z => ZN[z] || z;
const TABS = [["resumen", "Resumen"], ["ocupacion", "Ocupación"], ["facturacion", "Facturación"], ["oferta", "Oferta"], ["curvas", "Ritmo de reserva"], ["clases", "Clases"], ["proximas", "Próximas clases"], ["precios", "Precios"], ["estudios", "Estudios"], ["cadenas", "Cadenas"], ["alertas", "Alertas"], ["mapa", "Mapa"]];

let D, CAT, META, N, OCC, EST, HC, PX = null, CAD = null, OF = null;           // datos
let CATROWS = [];                        // catálogo como objetos
const F = { centro: "", marca: "", estudio: "", disc: "", dias: new Set([0, 1, 2, 3, 4, 5, 6]), h0: 0, h1: 24, f0: "", f1: "", vs: true };
let tabActual = "resumen", chart = null, claseSel = null;
const sortState = {};

/* ---------- carga ---------- */
async function cargar() {
  const get = u => fetch(u).then(r => { if (!r.ok) throw new Error(u + " " + r.status); return r.json(); });
  [D, CAT, META] = await Promise.all([get("data/clases.json"), get("data/estudios.json"), get("data/meta.json")]);
  try { PX = await get("data/proximas.json"); } catch (e) { PX = null; }
  try { CAD = (await get("data/cadenas.json")).filas; } catch (e) { CAD = null; }
  try { OF = await get("data/oferta.json"); } catch (e) { OF = null; }
  N = D.n;
  EST = D.estudios;
  OCC = new Array(N);
  for (let i = 0; i < N; i++) OCC[i] = D.r[i] != null && D.a[i] > 0 ? Math.min(1, D.r[i] / D.a[i]) : null;
  const ult = D.checkpoints.length - 1;
  HC = new Array(N);   // la clase tiene alguna foto previa a su inicio (curva)
  for (let i = 0; i < N; i++) HC[i] = D.checkpoints.some((_, j) => j < ult && (D.cr[j][i] != null || D.cl[j][i] != null));
  CATROWS = CAT.rows.map(r => Object.fromEntries(CAT.cols.map((c, j) => [c, r[j]])));
  CATROWS.forEach(r => { r.disc_n = DISC_CAT[r.disciplina] || "Otros"; r.con_precio = r.precios_publicados === "Sí" || r.precios_publicados === "Parcial"; r.con_occ = !!r.captura; });
}

/* ---------- filtros ---------- */
function opciones(sel, items, todo) {
  const v = sel.value;
  sel.innerHTML = `<option value="">${esc(todo)}</option>` + items.map(([val, lab]) => `<option value="${esc(val)}">${esc(lab)}</option>`).join("");
  if ([...sel.options].some(o => o.value === v)) sel.value = v; else sel.value = "";
}
function montarFiltros() {
  opciones($("#f-centro"), D.dic.centro.map(c => [c, zn(c)]), "Todos");
  marcasSelect();
  opciones($("#f-disc"), DISCS.map(d => [d, d]), "Todas");
  const horas = Array.from({ length: 25 }, (_, h) => [h, String(h).padStart(2, "0") + ":00"]);
  $("#f-h0").innerHTML = horas.slice(0, 24).map(([v, l]) => `<option value="${v}">${l}</option>`).join("");
  $("#f-h1").innerHTML = horas.slice(1).map(([v, l]) => `<option value="${v}">${l}</option>`).join("");
  $("#f-h1").value = 24;
  $("#f-dias").innerHTML = DIAS.map((d, i) => `<label><input type="checkbox" data-d="${i}" checked>${d}</label>`).join("");
  $("#f-f0").min = $("#f-f1").min = META.desde; $("#f-f0").max = $("#f-f1").max = META.hasta;
  estudiosSelect(); zonaSeg();
  $("#filtros").open = window.innerWidth > 700;
}
function zonaSeg() {
  const seg = $("#zona-seg");
  seg.querySelectorAll("button").forEach(b => b.remove());
  [["", "Todos"], ...D.dic.centro.map(c => [c, zn(c)])].forEach(([v, l]) => {
    const b = document.createElement("button"); b.type = "button"; b.dataset.z = v; b.textContent = l;
    b.addEventListener("click", () => { $("#f-centro").value = v; marcasSelect(); estudiosSelect(); refrescar(); });
    seg.append(b);
  });
}
function marcasSelect() {
  const c = $("#f-centro").value;
  const marcas = [...new Set(EST.filter(e => !e.p && (!c || e.z === c)).map(e => e.m))].sort((a, b) => a.localeCompare(b, "es"));
  opciones($("#f-marca"), marcas.map(m => [m, m]), "Todas");
}
function estudiosSelect() {
  const c = $("#f-centro").value, m = $("#f-marca").value;
  const lista = EST.map((e, i) => [i, e]).filter(([, e]) => !e.p && (!c || e.z === c) && (!m || e.m === m))
    .sort((a, b) => a[1].n.localeCompare(b[1].n, "es"));
  opciones($("#f-estudio"), lista.map(([i, e]) => [i, e.n + (c ? "" : " · " + zn(e.z))]), "Todos");
}
function leerFiltros() {
  F.centro = $("#f-centro").value; F.marca = $("#f-marca").value; F.estudio = $("#f-estudio").value; F.disc = $("#f-disc").value;
  F.h0 = +$("#f-h0").value; F.h1 = +$("#f-h1").value; F.f0 = $("#f-f0").value; F.f1 = $("#f-f1").value; F.vs = $("#f-vs").checked; F.fest = $("#f-fest").checked;
  F.dias = new Set([...document.querySelectorAll("#f-dias input:checked")].map(x => +x.dataset.d));
}
function pasaBase(i, ignorarDisc) {
  if (F.centro && D.dic.centro[D.c[i]] !== F.centro) return false;
  if (!ignorarDisc && F.disc && D.dic.disc[D.d[i]] !== F.disc) return false;
  if (!F.dias.has(D.w[i])) return false;
  if (!F.fest && D.fe[i]) return false;
  const h = D.h[i] / 60;
  if (h < F.h0 || h >= F.h1) return false;
  const f = D.dic.fecha[D.f[i]];
  if (F.f0 && f < F.f0) return false;
  if (F.f1 && f > F.f1) return false;
  return true;
}
function pasaComp(i) {
  if (F.marca && EST[D.e[i]].m !== F.marca) return false;
  if (F.estudio !== "" && D.e[i] !== +F.estudio) return false;
  return true;
}
let GA = [], GB = [];
function aplicar() {
  GA = []; GB = [];
  for (let i = 0; i < N; i++) {
    // con "BeatCore vs resto", BeatCore se muestra siempre (ignora marca, estudio y disciplina) para dar perspectiva
    if (EST[D.e[i]].p) { if (F.vs ? pasaBase(i, true) : pasaBase(i) && pasaComp(i)) GA.push(i); }
    else if (pasaBase(i) && pasaComp(i)) GB.push(i);
  }
}

/* ---------- métricas ---------- */
function metricas(ix) {
  const occ = ix.map(i => OCC[i]).filter(v => v != null);
  const ll = ix.map(i => D.l[i]).filter(v => v != null);
  const res = ix.filter(i => D.r[i] != null).map(i => D.r[i]);
  const af = ix.filter(i => D.a[i] != null).map(i => D.a[i]);
  return { n: ix.length, nocc: occ.length, ocup: mean(occ), llenas: mean(ll), res: mean(res), aforo: median(af) };
}
function valorCurva(i, j, modo) {
  if (modo === "llenas") return D.cl[j][i];
  const r = D.cr[j][i], a = D.a[i];
  return r != null && a > 0 ? Math.min(1, r / a) : null;
}
// pareado: cada punto usa solo las clases que también tienen dato al inicio (0 h), así la muestra no cambia
// de un punto a otro; "fin" es la ocupación final de esas mismas clases.
function mediaCurva(ix, j, modo, pareado) {
  const last = D.checkpoints.length - 1, v = [], f = [];
  for (const i of ix) {
    const x = valorCurva(i, j, modo);
    if (x == null) continue;
    const fin = valorCurva(i, last, modo);
    if (pareado && fin == null) continue;
    // el punto de 0 h solo cuenta las clases que también aparecen en algún punto anterior de la curva
    if (pareado && j === last && !D.checkpoints.some((_, k) => k < last && valorCurva(i, k, modo) != null)) continue;
    v.push(x); if (fin != null) f.push(fin);
  }
  return { v: mean(v), n: v.length, fin: mean(f) };
}

/* ---------- utilidades de tabla ---------- */
function tabla(id, cols, rows, o = {}) {
  const st = sortState[id] || (sortState[id] = o.sort || null);
  let data = rows;
  if (st) { const c = cols.find(c => c.k === st.k); data = [...rows].sort((a, b) => {
    const x = a[st.k], y = b[st.k]; if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    return (typeof x === "string" ? x.localeCompare(y, "es") : x - y) * st.dir; }); }
  const lim = o.limit || 400, vis = data.slice(0, lim);
  const th = cols.map(c => `<th class="${c.n ? "n " : ""}${c.c ? "c " : ""}sort" data-k="${c.k}">${esc(c.l)}${st && st.k === c.k ? (st.dir > 0 ? " ▲" : " ▼") : ""}</th>`).join("");
  const body = vis.map((r, ix) => `<tr class="${o.click ? "click" : ""}${o.sel && o.sel(r) ? " sel" : ""}" data-i="${r._i ?? ix}">` +
    cols.map(c => `<td class="${c.n ? "n" : ""}${c.c ? "c" : ""}">${c.h ? c.h(r) : esc(c.f ? c.f(r[c.k], r) : r[c.k] ?? "–")}</td>`).join("") + "</tr>").join("");
  const extra = data.length > lim ? `<p class="nota">Mostrando ${lim} de ${data.length} filas. Filtra o ordena para ver otras.</p>` : "";
  return `<div class="scroll" data-t="${id}"><table><thead><tr>${th}</tr></thead><tbody>${body || `<tr><td colspan="${cols.length}" class="vacio-msg">Sin datos con estos filtros</td></tr>`}</tbody></table></div>${extra}`;
}
function enlazarTabla(el, id, render, onRow) {
  el.querySelectorAll(`[data-t="${id}"] th.sort`).forEach(th => th.addEventListener("click", () => {
    const k = th.dataset.k, st = sortState[id];
    sortState[id] = { k, dir: st && st.k === k ? -st.dir : (th.classList.contains("n") ? -1 : 1) };
    render();
  }));
  if (onRow) el.querySelectorAll(`[data-t="${id}"] tbody tr.click`).forEach(tr => tr.addEventListener("click", () => onRow(+tr.dataset.i)));
}
const lin = ix => ix === GA ? '<span class="tag">BeatCore</span>' : '<span class="tag b">Competencia</span>';

/* ---------- pestañas ---------- */
function grupal(r) { return r.filter(x => x.tipo_servicio === "Grupal"); }
function medDe(rows, k) { return median(rows.map(r => r[k]).filter(v => v != null)); }
function zonasVisibles() { return F.centro ? [F.centro] : D.dic.centro; }
function porId(ix) {
  const m = new Map();
  for (const i of ix) { const id = EST[D.e[i]].id; if (!m.has(id)) m.set(id, []); m.get(id).push(i); }

function barras(items, max, cls) {

}

// rango de horas común a BeatCore y competencia, para que las dos tablas queden alineadas fila a fila
function rangoHoras(...grupos) {
  let a = 24, b = 0;
  for (const g of grupos) for (const i of g) { if (OCC[i] == null) continue; const h = Math.floor(D.h[i] / 60); a = Math.min(a, h); b = Math.max(b, h); }
  return [a, b];
}
function heatmap(ix, titulo, rgb, [hmin, hmax]) {
  const sum = {}, cnt = {};
  for (const i of ix) {
    if (OCC[i] == null) continue;
    const h = Math.floor(D.h[i] / 60), k = h * 7 + D.w[i];
    sum[k] = (sum[k] || 0) + OCC[i]; cnt[k] = (cnt[k] || 0) + 1;
  }
  if (hmin > hmax) return `<div><h3>${titulo}</h3><p class="vacio-msg">Sin datos con ocupación</p></div>`;
  let h = `<div><h3>${titulo}</h3><div class="scroll"><table class="heat"><thead><tr><th></th>${DIAS.map(d => `<th>${d}</th>`).join("")}</tr></thead><tbody>`;
  for (let hr = hmin; hr <= hmax; hr++) {
    h += `<tr><th>${String(hr).padStart(2, "0")}h</th>`;
    for (let d = 0; d < 7; d++) {
      const k = hr * 7 + d;
      if (!cnt[k]) { h += `<td class="vacio"></td>`; continue; }
      const v = sum[k] / cnt[k];
      h += `<td class="${v > .6 ? "dark" : ""}" style="--c:${rgb};--o:${v.toFixed(2)}" title="${cnt[k]} clases">${Math.round(v * 100)}%</td>`;
    }
    h += "</tr>";
  }
  return h + `</tbody></table></div></div>`;
}
function ocupacion() {
  const rango = rangoHoras(GA, GB);
  let h = `<section><h2>Mapa de calor: ocupación media por día y hora</h2><div class="heats">${heatmap(GA, "BeatCore", "var(--accent-rgb)", rango)}${heatmap(GB, "Competencia", "var(--comp-rgb)", rango)}</div>
    <p class="nota">% de ocupación media de las clases que empiezan en cada hora. Pasa el ratón (o mantén pulsado) para ver cuántas clases hay detrás.</p></section>`;
  const por = new Map();
  for (const i of [...GA, ...GB]) {
    const e = D.e[i]; if (!por.has(e)) por.set(e, []);
    por.get(e).push(i);
  }
  const rows = [...por].map(([e, ix]) => { const m = metricas(ix); return { _i: e, estudio: EST[e].n, centro: zn(EST[e].z), marca: EST[e].m, propio: EST[e].p, n: m.n, nocc: m.nocc, ocup: m.ocup, llenas: m.llenas, aforo: m.aforo }; });
  const cols = [{ k: "estudio", l: "Estudio", h: r => esc(r.estudio) + (r.propio ? ' <span class="tag">BeatCore</span>' : "") }, { k: "centro", l: "Centro" }, { k: "marca", l: "Marca" },
    { k: "n", l: "Clases", n: 1 }, { k: "ocup", l: "Ocupación", n: 1, h: r => r.ocup == null ? "–" : `<span class="bar ${r.propio ? "a" : ""}" style="width:${Math.round(r.ocup * 80)}px"></span>${pct(r.ocup)}` },
    { k: "llenas", l: "% llenas", n: 1, f: pct }, { k: "aforo", l: "Plazas/clase (mediana)", n: 1, f: v => num(v) }];
  if (!sortState["t-rank"]) sortState["t-rank"] = { k: "ocup", dir: -1 };
  h += `<section><h2>Ranking de estudios</h2>${tabla("t-rank", cols, rows)}
    <p class="nota">Con pocas clases por estudio, la media no es fiable: mira la columna Clases.</p></section>`;
  $("#p-ocupacion").innerHTML = h;
  enlazarTabla($("#p-ocupacion"), "t-rank", ocupacion);

}

function curvas() {
  const el = $("#p-curvas");
  const cps = D.checkpoints, momentos = [4, 6, 8]; // 24 h, 6 h, 1 h
  const por = new Map();
  for (const i of [...GA, ...GB]) { const e = D.e[i]; if (!por.has(e)) por.set(e, []); por.get(e).push(i); }
  const calc = ix => {
    const o = { n: ix.length };
    for (const j of momentos) {
      const oc = [];
      for (const i of ix) {
        const r = D.cr[j][i], a = D.a[i];
        if (r != null && a > 0) oc.push(Math.min(1, r / a));
      }
      o["o" + j] = mean(oc); o["n" + j] = oc.length;
    }
    const fin = ix.map(i => OCC[i]).filter(v => v != null);
    o.fin = mean(fin); o.nf = fin.length;
    return o;
  };
  const todas = [...por].map(([e, ix]) => ({ _i: e, estudio: EST[e].n, centro: zn(EST[e].z), propio: EST[e].p, ...calc(ix) }));
  const rows = todas.filter(r => momentos.some(j => r["n" + j] > 0));
  const celda = j => ({ k: "o" + j, l: `${cps[j]} h antes`, n: 1,
    h: r => r["o" + j] == null ? "–" : `${pct(r["o" + j])} <small>(${r["n" + j]})</small>` });
  const cols = [{ k: "estudio", l: "Estudio", h: r => esc(r.estudio) + (r.propio ? ' <span class="tag">BeatCore</span>' : "") },
    { k: "centro", l: "Centro" }, { k: "n", l: "Clases", n: 1 },
    ...momentos.map(celda),
    { k: "fin", l: "Total (al empezar)", n: 1, h: r => r.fin == null ? "–" : `<b>${pct(r.fin)}</b> <small>(${r.nf})</small>` }];
  if (!sortState["t-rit"]) sortState["t-rit"] = { k: "estudio", dir: 1 };
  el.innerHTML = `<section><h2>Ocupación antes de empezar la clase</h2>
    <p class="meta">Qué % de plazas estaba reservado 24, 6 y 1 hora antes de empezar, y cuánto al empezar.</p>
    ${tabla("t-rit", cols, rows, { limit: 300 })}
    <div class="guia"><ul>
      <li>Una fila por estudio. Cada número es el <b>% de plazas reservadas</b> en ese momento, de media entre sus clases.</li>
      <li><b>Total (al empezar)</b>: la ocupación cuando empezó la clase.</li>
      <li>Comparando una fila de izquierda a derecha ves <b>cómo se va llenando</b>: si ya está alto a 24 h, llena con antelación; si sube sobre todo en las últimas horas, llena sobre la hora.</li>
      <li><b>Número entre paréntesis</b>: cuántas clases hay detrás de ese dato. Con 1 o 2 es una anécdota, no un patrón.</li>
      <li><b>"–"</b>: todavía no tenemos foto de ese momento para ese estudio.</li>
      <li>Solo salen los estudios con alguna clase fotografiada antes de empezar (${rows.length} de ${todas.length}).</li>

  enlazarTabla(el, "t-rit", curvas);
}

function proximas() {
  const el = $("#p-proximas");
  if (!PX || !PX.n) { el.innerHTML = '<p class="vacio-msg">Todavía no hay clases próximas capturadas.</p>'; return; }
  const P = PX, EP = P.estudios, q = (el.dataset.q || "").toLowerCase(), dia = el.dataset.dia || "";
  const estSel = F.estudio !== "" ? EST[+F.estudio] : null;
  const rows = [];
  for (let i = 0; i < P.n; i++) {
    const e = EP[P.e[i]], f = P.dic.fecha[P.f[i]];
    if (F.centro && P.dic.centro[P.c[i]] !== F.centro) continue;
    if (F.disc && P.dic.disc[P.d[i]] !== F.disc) continue;
    if (!F.dias.has(P.w[i]) || (!F.fest && P.fe[i])) continue;
    const h = P.h[i] / 60;
    if (h < F.h0 || h >= F.h1) continue;
    if ((F.f0 && f < F.f0) || (F.f1 && f > F.f1) || (dia && f !== dia)) continue;
    if (F.marca && e.m !== F.marca) continue;
    if (estSel && !(e.n === estSel.n && e.z === estSel.z)) continue;
    const hh = String(Math.floor(P.h[i] / 60)).padStart(2, "0") + ":" + String(P.h[i] % 60).padStart(2, "0");
    const a = P.a[i], r = P.r[i];
    const row = { _i: i, fecha: f, hora: hh, centro: zn(P.dic.centro[P.c[i]]), estudio: e.n, propio: e.p, clase: P.dic.clase[P.k[i]],
      disc: P.dic.disc[P.d[i]], plat: P.dic.plat[P.p[i]], aforo: a, est: P.af[i] === 1, res: r,
      ocup: r != null && a > 0 ? Math.min(1, r / a) : null, llena: P.l[i] == null ? null : P.l[i] === 1, foto: P.dic.ts[P.t[i]] };
    if (q && !(row.estudio + " " + row.clase + " " + row.disc).toLowerCase().includes(q)) continue;
    rows.push(row);
  }
  const mA = metricas2(rows.filter(r => r.propio)), mB = metricas2(rows.filter(r => !r.propio));
  const cols = [{ k: "fecha", l: "Fecha" }, { k: "hora", l: "Hora" }, { k: "centro", l: "Centro" },
    { k: "estudio", l: "Estudio", h: r => esc(r.estudio) + (r.propio ? ' <span class="tag">BeatCore</span>' : "") },
    { k: "clase", l: "Clase" },
    { k: "ocup", l: "Reservado ahora", n: 1, h: r => r.llena === true ? "<b>Llena</b>" : (r.ocup == null ? "–" : `<span class="bar ${r.propio ? "a" : ""}" style="width:${Math.round(r.ocup * 60)}px"></span>${pct(r.ocup)}`) },
    { k: "aforo", l: "Plazas ofrecidas", n: 1, f: (v, r) => v == null ? "–" : v + (r.est ? "*" : "") }, { k: "res", l: "Plazas reservadas", n: 1 },
    { k: "disc", l: "Disciplina" }, { k: "plat", l: "Plataforma" },
    { k: "foto", l: "Último dato" }];
  if (!sortState["t-px"]) sortState["t-px"] = { k: "fecha", dir: 1 };
  const dias = [...new Set(P.dic.fecha)].sort();
  const kpi = (cl, v, t) => `<div class="kpi ${cl}"><b>${v}</b><span>${t}</span></div>`;
  el.innerHTML = `<section><h2>Próximas clases y cuánto llevan reservado</h2>
    <p class="meta">Reservas en la última foto que tenemos de cada clase (columna "Último dato"). Aún pueden subir o bajar hasta que empiece la clase.</p>
    <div class="kpis">${kpi("a", pct(mA.ocup), "BeatCore: reservado ahora (" + mA.n + " clases)")}${kpi("b", pct(mB.ocup), "Competencia: reservado ahora (" + mB.n + " clases)")}</div>
    <div class="row"><label>Día <select id="px-dia"><option value="">Todos</option>${dias.map(d => `<option value="${d}"${d === dia ? " selected" : ""}>${d}</option>`).join("")}</select></label>
    <input type="search" id="px-q" placeholder="Buscar estudio, clase o disciplina" value="${esc(el.dataset.q || "")}" aria-label="Buscar">
    <span class="meta">${rows.length} clases</span></div>
    ${tabla("t-px", cols, rows, { limit: 400 })}
    <p class="nota">* plazas estimadas (Mindbody, cota inferior). Los filtros de arriba (centro, marca, estudio, disciplina, día, horas) también se aplican aquí. Última captura: ${esc(P.ahora)}.</p></section>`;

  const cad = [...grupos.entries()].filter(([c]) => !q || c.toLowerCase().includes(q)).map(([c, us]) => {
    const r = { cadena: c, cen: us.length, con: us.filter(u => u.fact.precio_ses != null && u.fmeses.length).length,
      ps: mean(us.map(u => u.fact.precio_ses).filter(v => v != null)) };
    meses.forEach(p => { r["o_" + p] = suma(us, u => (M(u, p) || {}).fact_obs); r["e_" + p] = suma(us, u => (M(u, p) || {}).fact_est);

/* ---------- periodo: el rango de fechas de los filtros de arriba manda también en Oferta, Cadenas y Facturación ---------- */
function hayRango() { return !!(F.f0 || F.f1); }
function fES2(f) { return f ? f.split("-").reverse().join("/") : ""; }
function periodoTxt() {
  return hayRango() ? `Periodo: del ${fES2(F.f0) || "inicio"} al ${fES2(F.f1) || "último día"}` : "Periodo: todo el histórico medido (cambia las fechas de los filtros de arriba para acotarlo)";
}
function vistaRango(u) {
  // el mismo centro, pero calculado solo con los días del rango de fechas
  if (!hayRango() || !u.fd || !OF.fechas) return u;
  const a = F.f0 || "", b = F.f1 || "";
  const fechasDow = Array.from({ length: 7 }, () => new Set());
  const dia = Array.from({ length: 7 }, () => ({ c: 0, p: 0, r: 0, m: 0 }));
  const celdas = new Map();
  let R = 0, M = 0, C = 0, X = 0;
  const todas = new Set();
  for (let i = 0; i < u.fd.length; i++) {
    const f = OF.fechas[u.fd[i]];
    if ((a && f < a) || (b && f > b)) continue;
    const dow = (new Date(f + "T00:00:00Z").getUTCDay() + 6) % 7;
    fechasDow[dow].add(f); todas.add(f);
    const d = dia[dow]; d.c += u.fc[i]; d.p += u.fp[i]; d.r += u.fr[i]; d.m += u.fm[i];
    const k = dow * 100 + u.fh[i];
    const c = celdas.get(k) || { d: dow, h: u.fh[i], c: 0, p: 0, r: 0, pm: 0 };
    c.c += u.fc[i]; c.p += u.fp[i]; c.r += u.fr[i]; c.pm += u.fm[i]; celdas.set(k, c);
    R += u.fr[i]; M += u.fm[i]; C += u.fc[i]; X += u.fx[i];
  }
  const dias = dia.map((d, i) => {
    const nf = fechasDow[i].size;
    return { d: i, fechas: nf, clases: nf ? d.c / nf : null, plazas: nf ? d.p / nf : null, reservas: nf ? d.r / nf : null,
      ocup: d.m > 0 ? d.r / d.m : null, medidas: 0, _r: d.r, _m: d.m };
  });
  const ps = u.fact ? u.fact.precio_ses : null;
  return { ...u, dias, celdas: [...celdas.values()], ocup: M > 0 ? R / M : null, reservas: R, plazas_med: M, n_clases: C, n_dias: todas.size,
    _rango: true, _fp: ps != null ? Math.round(X * ps) : null, _res_rango: X };
}

/* ---------- alertas: centros y cadenas que suben o bajan (última semana completa frente a la anterior) ---------- */
const UMBRAL_OCUP = 5, UMBRAL_CLASES = 10;      // puntos porcentuales de ocupación y % de clases por día
function semanaIni(p) {
  const y = +p.slice(0, 4), w = +p.slice(6);
  const j4 = new Date(Date.UTC(y, 0, 4)), lun1 = new Date(j4.getTime() - ((j4.getUTCDay() + 6) % 7) * 86400000);
  return new Date(lun1.getTime() + (w - 1) * 7 * 86400000);
}
const fISO = d => d.toISOString().slice(0, 10);
const fES = d => fISO(d).split("-").reverse().join("/");
function compararSemanas(u, hoy) {
  // dos últimas semanas completas (6 o 7 días, ya terminadas) y consecutivas
  const ok = (u.semanas || []).filter(s => s.dias >= 6 && s.plazas > 0 && s.clases > 0 && fISO(new Date(semanaIni(s.p).getTime() + 6 * 86400000)) < hoy)
    .sort((a, b) => a.p.localeCompare(b.p));
  if (ok.length < 2) return null;
  const a = ok[ok.length - 2], b = ok[ok.length - 1];
  if ((semanaIni(b.p) - semanaIni(a.p)) !== 7 * 86400000) return null;
  const cda = a.clases / a.dias, cdb = b.clases / b.dias;
  const dCl = (cdb / cda - 1) * 100;
  const dOc = a.ocup != null && b.ocup != null ? (b.ocup - a.ocup) * 100 : null;
  return { a, b, dCl, dOc, cda, cdb };
}
function tipoAlerta(r) {
  const bajaO = r.dOc != null && r.dOc <= -UMBRAL_OCUP, bajaC = r.dCl <= -UMBRAL_CLASES;
  const subeO = r.dOc != null && r.dOc >= UMBRAL_OCUP, subeC = r.dCl >= UMBRAL_CLASES;
  if (bajaO && bajaC) return "Bajan las dos";
  if (bajaO) return "Baja ocupación";
  if (bajaC) return "Bajan clases ofertadas";
  if (subeO && subeC) return "Suben las dos";
  if (subeO) return "Sube ocupación";
  if (subeC) return "Suben clases ofertadas";
  return "";
}
function alertas() {
  const el = $("#p-alertas");
  if (!OF) { el.innerHTML = '<p class="vacio-msg">Todavía no hay datos.</p>'; return; }
  const hoy = (OF.ahora || "").slice(0, 10);
  const fil = el.dataset.tipo || "";
  const tag = t => /^Baj/.test(t) ? `<span class="tag" style="background:#7a2e2e;color:#fff">${esc(t)}</span>` : `<span class="tag">${esc(t)}</span>`;
  const mk = (nombre, cadena, u, extra) => {
    const c = compararSemanas(u, hoy);
    if (!c) return null;
    const t = tipoAlerta(c);
    return { nombre, cadena, ciu: extra.ciu || "", prov: extra.prov || "", tipo: t, a: c.a.p, b: c.b.p,
      cda: c.cda, cdb: c.cdb, dCl: c.dCl, oa: c.a.ocup, ob: c.b.ocup, dOc: c.dOc };
  };
  const unidades = OF.unidades.filter(u => !u.propio && ubicOK(u));
  const filasU = unidades.map(u => mk(u.estudio, (u.cadenas || [])[0] || "", u, u)).filter(Boolean);
  const filasC = (OF.cadenas || []).filter(c => !/^beatcore$/i.test(c.cadena)).map(c => mk(c.cadena, "", c, {})).filter(Boolean);
  // cuándo habrá dos semanas completas
  const primeras = OF.unidades.flatMap(u => (u.semanas || []).filter(s => s.dias >= 6).map(s => s.p)).sort();
  const sinDatos = !filasU.length && !filasC.length;
  const ini = primeras.length ? semanaIni(primeras[0]) : null;
  const disp = ini ? new Date(ini.getTime() + 14 * 86400000) : null;
  const colsU = [{ k: "tipo", l: "Alerta", h: r => r.tipo ? tag(r.tipo) : "–" },
    { k: "nombre", l: "Centro" }, { k: "cadena", l: "Cadena" }, { k: "ciu", l: "Ciudad" }, { k: "prov", l: "Provincia" },
    { k: "cda", l: "Clases / día (anterior)", n: 1, f: v => num(v) }, { k: "cdb", l: "Clases / día (última)", n: 1, f: v => num(v) },
    { k: "dCl", l: "Cambio clases", n: 1, f: v => v == null ? "–" : (v > 0 ? "+" : "") + Math.round(v) + " %" },
    { k: "oa", l: "% reservado (anterior)", n: 1, f: pct }, { k: "ob", l: "% reservado (última)", n: 1, f: pct },
    { k: "dOc", l: "Cambio reservado", n: 1, f: v => v == null ? "–" : (v > 0 ? "+" : "") + Math.round(v) + " pp" }];
  const colsC = colsU.filter(c => !["cadena", "ciu", "prov"].includes(c.k)).map(c => c.k === "nombre" ? { ...c, l: "Cadena" } : c);
  const sel = t => filtro => filtro ? `<option value="${t}"${fil === t ? " selected" : ""}>${t}</option>` : "";

  [u, c].forEach(a => a.sort((x, y) => orden[x.tipo] - orden[y.tipo] || (x.dOc ?? 0) - (y.dOc ?? 0)));

  const kpis = cuenta(filasU).map(([t, n]) => `<div class="kpi ${/^Baj/.test(t) ? "" : "b"}"><b>${n}</b><span>${t}</span></div>`).join("");

    <div class="guia"><ul>

      <li><b>Suben</b> es lo contrario. Si pasa lo mismo con las dos cosas, sale como "las dos".</li>

      <span class="meta">${u.length} centros · ${c.length} cadenas</span></div></section>
    ${sinDatos ? "" : `<section><h2>Centros (${u.length})</h2>${tabla("t-al-u", colsU, u, { limit: 400 })}</section>
    <section><h2>Cadenas (${c.length})</h2>${tabla("t-al-c", colsC, c, { limit: 200 })}</section>`}`;
  $("#al-tipo").addEventListener("change", e => { el.dataset.tipo = e.target.value; alertas(); });
  bindUbic("al", alertas);
  ["t-al-u", "t-al-c"].forEach(t => enlazarTabla(el, t, alertas));
}

/* ---------- oferta de clases (por día de la semana, semana y mes) ---------- */
const DIAS_L = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
function factMesActual(u) {
  // mes en curso: lo capturado hasta hoy y la estimación del mes completo
  const p = OF && OF.ahora ? OF.ahora.slice(0, 7) : "";
  const m = (u.fmeses || []).find(x => x.p === p);
  return m ? { obs: m.fact_obs, est: m.fact_est, desde: m.desde, p } : { obs: null, est: null, desde: null, p };
}
function etiquetaFact() {
  const p = OF && OF.ahora ? OF.ahora.slice(0, 7) : "";
  return p ? MES_N[+p.slice(5) - 1] : "mes";
}
function resumenOferta(u) {
  if (!u) return null;
  const ds = u.dias.filter(d => d.clases != null);
  const completo = ds.length === 7;
  const clases = completo ? ds.reduce((s, d) => s + d.clases, 0) : (u.n_dias ? u.n_clases / u.n_dias * 7 : null);
  const plazas = completo ? ds.reduce((s, d) => s + d.plazas, 0) : (u.n_dias ? ds.reduce((s, d) => s + d.plazas, 0) / ds.length * 7 : null);
  return { clases, plazas, ocup: u.ocup, completo, dias: u.n_dias };
}
function ofertaPorDia(items) {
  // items: [{nombre, u}] -> tabla con clases/día, plazas/día y ocupación por día de la semana
  const cab = DIAS_L.map(d => `<th class="n">${d}</th>`).join("");
  const fila = (nom, u, k, f, div) => `<tr><td>${nom}</td>${u.dias.map(d => `<td class="n">${d[k] == null ? "–" : f(d[k] / (div || 1))}</td>`).join("")}</tr>`;
  const uno = items.length === 1 && items[0].n > 1 ? items[0] : null;   // una sola cadena: total y media por centro
  const bloque = (titulo, k, f) => `<tr><th colspan="8" class="sub">${titulo}</th></tr>` + (uno
    ? fila(`Total (${uno.n} centros)`, uno.u, k, f) + fila("Media por centro", uno.u, k, f, uno.n)
    : items.map(it => fila(items.length === 1 ? "Total" : it.nombre, it.u, k, f)).join(""));
  const ocup = `<tr><th colspan="8" class="sub">Ocupación (reservas / plazas)</th></tr>` + items.map(it => fila(items.length === 1 ? "Media" : it.nombre, it.u, "ocup", pct)).join("");
  return `<div class="scroll"><table><thead><tr><th></th>${cab}</tr></thead><tbody>
    ${bloque("Clases por día (media)", "clases", v => numC(v))}${bloque("Plazas ofertadas por día (media)", "plazas", v => Math.round(v))}
    ${ocup}</tbody></table></div>`;
}
function ofertaPeriodo(items, clave) {
  // items: [{nombre, u}]; clave: "semanas" | "meses"
  const per = [...new Set(items.flatMap(it => it.u[clave].map(x => x.p)))].sort().reverse();
  const unoP = items.length === 1 && items[0].n > 1 ? items[0] : null;
  const cols = items.map(it => `<th class="n" colspan="${unoP ? 5 : 3}">${items.length === 1 ? "Total" + (unoP ? ` (${unoP.n} centros) y media por centro` : "") : esc(it.nombre)}</th>`).join("");
  const sub = items.map(() => `<th class="n">Clases</th><th class="n">Plazas</th><th class="n">Ocup.</th>${unoP ? '<th class="n">Clases / centro</th><th class="n">Plazas / centro</th>' : ""}`).join("");
  const filas = per.map(p => `<tr><td>${esc(p)}</td>${items.map(it => {
    const x = it.u[clave].find(y => y.p === p);
    const pc = unoP ? (x ? `<td class="n">${num(x.clases / unoP.n)}</td><td class="n">${Math.round(x.plazas / unoP.n)}</td>` : `<td class="n">–</td><td class="n">–</td>`) : "";
    return x ? `<td class="n">${x.clases}${x.dias < (clave === "semanas" ? 7 : 28) ? ` <small>(${x.dias} d)</small>` : ""}</td><td class="n">${x.plazas}</td><td class="n">${pct(x.ocup)}</td>${pc}` : `<td class="n">–</td><td class="n">–</td><td class="n">–</td>${pc}`;
  }).join("")}</tr>`).join("");
  return `<div class="scroll"><table><thead><tr><th>${clave === "semanas" ? "Semana" : "Mes"}</th>${cols}</tr><tr><th></th>${sub}</tr></thead><tbody>${filas}</tbody></table></div>`;
}

  const modo = el.dataset["of" + key] || "dia";

/* ---------- tabla de centros: clases, plazas ofertadas, ocupadas y % reservado ---------- */
function tablaCentros(el, key, unidades, tituloPrimera) {
  const per = "dia", met = el.dataset["met" + key] || "clases";
  const dset = new Set((el.dataset["dd" + key] || "0123456").split("").map(Number));

  zs.forEach((z, i) => {
    const cy = top + i * band + band / 2, rz = rows.filter(r => r.zona === z).sort((a, b) => a.ocho_mes - b.ocho_mes);
    svg += `<text x="0" y="${cy + 4}" font-size="12" fill="var(--fg)">${esc(zn(z))}</text>`;
    if (!rz.length) svg += `<text x="${L}" y="${cy + 4}" font-size="12" fill="var(--muted)">Ningún estudio publica este precio</text>`;
    else {
      const m = median(rz.map(r => r.ocho_mes));
      svg += `<line x1="${X(m)}" x2="${X(m)}" y1="${cy - 22}" y2="${cy + 22}" stroke="var(--fg)" stroke-width="2"/><text x="${X(m)}" y="${cy - 26}" text-anchor="middle" font-size="11" fill="var(--fg)">${esc(eur(m))}</text>`;
      rz.forEach((r, k) => { svg += `<circle cx="${X(r.ocho_mes)}" cy="${cy + ((k % 3) - 1) * 8}" r="5" fill="var(--comp)" fill-opacity=".8"><title>${esc(r.estudio)} · ${esc(eur(r.ocho_mes))} (${esc(eur(r.ocho_mes / 8))} por clase)</title></circle>`; });
    }
    const b = verBC && bc(z);
    if (b && b.ocho_mes != null) {
      const x = X(b.ocho_mes), y = cy;
      svg += `<polygon points="${x},${y - 9} ${x + 9},${y} ${x},${y + 9} ${x - 9},${y}" fill="var(--accent)" stroke="var(--bg)" stroke-width="1.5"><title>BeatCore ${esc(zn(z))}: ${esc(eur(b.ocho_mes))}</title></polygon>
        <text x="${x}" y="${y + 24}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--accent)">BeatCore ${esc(eur(b.ocho_mes))}</text>`;
    }
  });
  svg += "</svg>";
  const grupos = GRUPOS.map(x => `<option${x === grupo ? " selected" : ""}>${esc(x)}</option>`).join("");

  // BeatCore frente a la mediana de su competencia directa
  const comp = [];
  for (const z of zs) {
    const b = bc(z); if (!b) continue;
    for (const [k, l] of [["clase_suelta", "Clase suelta"], ["cuatro_mes", "4 clases al mes"], ["ocho_mes", "8 clases al mes"], ["ilimitada", "Ilimitada"]]) {
      if (b[k] == null) continue;
      const v = directos(z).map(r => r[k]).filter(x => x != null), m = median(v);
      comp.push({ centro: zn(z), precio: l, beat: b[k], med: m, dif: m ? b[k] / m - 1 : null, n: v.length });
    }
  }
  const colsC = [{ k: "centro", l: "Centro" }, { k: "precio", l: "Paquete" }, { k: "beat", l: "BeatCore", c: 1, h: r => `<b>${esc(eur(r.beat))}</b>` },
    { k: "med", l: "Mediana competencia directa", c: 1, f: eur },
    { k: "dif", l: "Diferencia vs BeatCore", c: 1, f: v => v == null ? "–" : (v > 0 ? "+" : "") + Math.round(v * 100) + " %" },
    { k: "n", l: "Estudios con ese precio", c: 1 }];

  const colsM = [{ k: "grupo", l: "Tipo" }, { k: "zona", l: "Zona" }, { k: "estudios", l: "Estudios", n: 1 }, { k: "con", l: "Con precio", n: 1 },
    { k: "suelta", l: "Clase suelta", n: 1, f: eur }, { k: "cuatro", l: "4/mes", n: 1, f: eur }, { k: "ocho", l: "8/mes", n: 1, f: eur },
    { k: "clase", l: "€/clase con 8", n: 1, f: eur }, { k: "ilim", l: "Ilimitada", n: 1, f: eur }];
  const zonasT = [...zs, ...(zs.length > 1 ? ["Todas"] : [])], med = [];
  for (const gr of GRUPOS) for (const z of zonasT) {
    const e = cat.filter(r => r.grupo === gr && (z === "Todas" || r.zona === z)), gg = grupal(e);
    med.push({ grupo: gr, zona: z === "Todas" ? "Todas" : zn(z), estudios: e.length, con: gg.filter(r => r.con_precio).length, suelta: medDe(gg, "clase_suelta"),
      cuatro: medDe(gg, "cuatro_mes"), ocho: medDe(gg, "ocho_mes"), clase: median(gg.map(r => r.ocho_mes).filter(v => v != null).map(v => v / 8)), ilim: medDe(gg, "ilimitada") });
  }
  const colsT = [{ k: "estudio", l: "Estudio", h: r => esc(r.estudio) + (r.propio ? ' <span class="tag">BeatCore</span>' : "") },
    { k: "zona", l: "Centro", f: zn }, { k: "grupo", l: "Tipo" },
    { k: "clase_suelta", l: "Clase suelta", n: 1, f: eur }, { k: "cuatro_mes", l: "4/mes", n: 1, f: eur }, { k: "ocho_mes", l: "8/mes", n: 1, f: eur },
    { k: "doce_mes", l: "12/mes", n: 1, f: eur }, { k: "ilimitada", l: "Ilimitada", n: 1, f: eur }, { k: "oferta_entrada", l: "Oferta entrada", n: 1, f: eur }, { k: "precios_publicados", l: "Precios" }];
  const prow = [...propios, ...cat.filter(r => r.con_precio)];
  el.innerHTML = `<section><h2>BeatCore frente a su competencia directa</h2>
    ${comp.length ? tabla("t-comp-pr", colsC, comp, { limit: 40 }) : '<p class="vacio-msg">No hay precios de BeatCore con estos filtros.</p>'}
    <div class="guia"><ul>
      <li><b>Mediana competencia directa</b>: precio que deja a la mitad de los estudios de reformer y Lagree de la zona por debajo y a la otra mitad por encima.</li>
    </ul></div></section>
    <section><div class="row"><h2 style="margin:0">Precio de 8 clases al mes</h2><label>Tipo <select id="p-grupo">${grupos}</select></label></div>
    <div class="chartbox" style="height:auto">${svg}</div>
    <div class="guia"><ul>
      <li>Cada <b>punto naranja</b> es un estudio que publica ese precio (con IVA). Pasa el ratón por encima para ver cuál es.</li>
      <li>La <b>raya blanca</b> es la mediana de la zona: la mitad de los estudios cuesta menos y la otra mitad más.</li>
      <li>El <b>rombo verde</b> es BeatCore. Aparece siempre, con cualquier tipo, para que tengas la referencia.</li>
      <li>La <b>escala (0 a 250 €) es siempre la misma</b>, así puedes comparar un tipo con otro.</li>
      <li>Los puntos con el mismo precio se solapan.</li>
    </ul></div></section>
    <section><h2>Medianas por zona y tipo</h2>${tabla("t-med", colsM, med, { limit: 100 })}
    <div class="guia"><ul>
      <li>Solo servicio grupal. "Con precio" cuenta cuántos estudios publican tarifas.</li>
      <li>Con menos de 3 estudios con precio, la mediana es orientativa.</li>
    </ul></div></section>
    <section><h2>Precios por estudio (${prow.length})</h2>${tabla("t-pre", colsT, prow)}</section>`;
  $("#p-grupo").addEventListener("change", e => { el.dataset.grupo = e.target.value; precios(); });
  ["t-comp-pr", "t-med", "t-pre"].forEach(t => enlazarTabla(el, t, precios));
}
function estudios() {
  const el = $("#p-estudios");
  const q = (el.dataset.q || "").toLowerCase();
  const rows = catFiltrado().filter(r => !q || [r.estudio, r.disciplina, r.plataforma, r.marca, r.grupo].join(" ").toLowerCase().includes(q))
    .map(r => ({ ...r, tienePrecio: r.precios_publicados, tieneOcc: r.con_occ ? "Sí" : "No" }));
  const cols = [{ k: "estudio", l: "Estudio", h: r => /^https?:\/\//.test(r.web || "") ? `<a href="${esc(r.web)}" target="_blank" rel="noopener noreferrer">${esc(r.estudio)}</a>${r.propio ? ' <span class="tag">BeatCore</span>' : ""}` : esc(r.estudio) + (r.propio ? ' <span class="tag">BeatCore</span>' : "") },
    { k: "zona", l: "Centro", f: zn }, { k: "grupo", l: "Tipo" }, { k: "disciplina", l: "Disciplina" }, { k: "cadena", l: "Cadena" },
    { k: "distancia_m", l: "Distancia", n: 1, f: v => v == null ? "–" : Math.round(v) + " m" },
    { k: "clase_suelta", l: "Suelta", n: 1, f: eur }, { k: "ocho_mes", l: "8/mes", n: 1, f: eur }, { k: "ilimitada", l: "Ilimitada", n: 1, f: eur },
    { k: "plataforma", l: "Plataforma" }, { k: "tieneOcc", l: "Ocupación" }, { k: "rating", l: "Google", n: 1, f: v => num(v) }];
  if (!sortState["t-est"]) sortState["t-est"] = { k: "distancia_m", dir: 1 };
  el.innerHTML = `<section><div class="row"><h2 style="margin:0">Todos los estudios (${rows.length})</h2>
    <input type="search" id="e-q" placeholder="Buscar estudio, disciplina o plataforma" value="${esc(el.dataset.q || "")}" aria-label="Buscar"></div>
    ${tabla("t-est", cols, rows, { limit: 500 })}
    <p class="nota">Precios con IVA tal como se publican.</p></section>`;
  const inp = $("#e-q");
  inp.addEventListener("input", e => { el.dataset.q = e.target.value; const p = e.target.selectionStart; estudios(); const n = $("#e-q"); n.focus(); n.setSelectionRange(p, p); });
  enlazarTabla(el, "t-est", estudios);
}
function mapa() {
  const u = META.mapa_url || "";
  const ok = /^https:\/\/www\.google\.com\/maps\/d\//.test(u);
  const enlace = u.replace("/embed", "/viewer");
  $("#p-mapa").innerHTML = ok ? `<iframe class="mapa" src="${esc(u)}" title="Mapa de estudios" loading="lazy"></iframe>
    <p class="nota"><a href="${esc(enlace)}" target="_blank" rel="noopener noreferrer">Abrir el mapa en Google Maps</a></p>`
    : `<p class="aviso">Falta el enlace del mapa. Hay que poner el enlace de inserción del My Maps (<code>https://www.google.com/maps/d/embed?mid=...</code>) en <code>web/config.json</code> (<code>mapa_url</code>).</p>`;
}

/* ---------- arranque ---------- */
const RENDER = { resumen, ocupacion, facturacion, oferta: ofertaTab, curvas, clases, proximas, precios, estudios, cadenas, alertas, mapa };
function render() { RENDER[tabActual](); }
function activar(t) {
  tabActual = t;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.t === t));
  document.querySelectorAll(".panel").forEach(p => p.hidden = p.id !== "p-" + t);
  if (location.hash !== "#" + t) history.replaceState(null, "", "#" + t);
  render();
}
function refrescar() { leerFiltros(); aplicar(); document.querySelectorAll('#zona-seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.z === F.centro))); render(); }

document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  const c = $("#p-cadenas");
  if (tabActual === "cadenas" && c && c.dataset.sel != null) { delete c.dataset.sel; cadenas(); }
  if (tabActual === "clases" && claseSel != null) { claseSel = null; clases(); }
});

(async function () {
  try { await cargar(); } catch (e) { $("#meta").textContent = "No se han podido cargar los datos: " + e.message; return; }
  const gen = META.generado ? new Date(META.generado).toLocaleString("es-ES", { dateStyle: "short", timeStyle: "short" }) : "";
  const dias = new Set(D.dic.fecha).size;
  $("#meta").textContent = `Clases del ${META.desde} al ${META.hasta} · ${dias} día${dias === 1 ? "" : "s"} con datos · ${N} clases · actualizado ${gen}`;
  if (dias < 14) { $("#aviso").hidden = false; $("#aviso").textContent = `Datos todavía escasos (${dias} día${dias === 1 ? "" : "s"}): las medias pueden cambiar mucho. Las curvas de reserva mejoran con los días.`; }
  $("#tabs").innerHTML = TABS.map(([k, l]) => `<button role="tab" data-t="${k}" aria-selected="false">${l}</button>`).join("");
  $("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) activar(b.dataset.t); });
  montarFiltros();
  $("#f-centro").addEventListener("change", () => { marcasSelect(); estudiosSelect(); refrescar(); });
  $("#f-marca").addEventListener("change", () => { estudiosSelect(); refrescar(); });
  ["#f-estudio", "#f-disc", "#f-h0", "#f-h1", "#f-f0", "#f-f1", "#f-vs", "#f-fest"].forEach(s => $(s).addEventListener("change", refrescar));
  $("#f-dias").addEventListener("change", refrescar);
  $("#f-reset").addEventListener("click", () => {
    ["#f-centro", "#f-marca", "#f-estudio", "#f-disc"].forEach(s => $(s).value = "");
    $("#f-h0").value = 0; $("#f-h1").value = 24; $("#f-f0").value = $("#f-f1").value = ""; $("#f-vs").checked = true; $("#f-fest").checked = true;
    document.querySelectorAll("#f-dias input").forEach(x => x.checked = true);
    marcasSelect(); estudiosSelect(); refrescar();
  });
  window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (RENDER[h] && h !== tabActual) activar(h); });
  const t = location.hash.slice(1);
  refrescar();
  activar(RENDER[t] ? t : "resumen");
})();
</script>
</body>
